<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Humayra Mahjabin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      min-height:100vh;
      background:#050816;
      overflow:hidden;
      color:white;
      position:relative;
    }

    /* Animated background */

    .bg{
      position:absolute;
      width:100%;
      height:100%;
      overflow:hidden;
      z-index:-1;
    }

    .bubble{
      position:absolute;
      bottom:-150px;
      background:rgba(255,255,255,0.08);
      border-radius:50%;
      animation:rise 20s infinite ease-in;
    }

    .bubble:nth-child(1){
      width:120px;
      height:120px;
      left:10%;
      animation-duration:18s;
    }

    .bubble:nth-child(2){
      width:80px;
      height:80px;
      left:35%;
      animation-duration:14s;
    }

    .bubble:nth-child(3){
      width:150px;
      height:150px;
      left:70%;
      animation-duration:22s;
    }

    .bubble:nth-child(4){
      width:60px;
      height:60px;
      left:85%;
      animation-duration:12s;
    }

    @keyframes rise{
      0%{
        transform:translateY(0) rotate(0deg);
        opacity:0;
      }

      30%{
        opacity:1;
      }

      100%{
        transform:translateY(-120vh) rotate(360deg);
        opacity:0;
      }
    }

    /* Main Card */

    .container{
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
    }

    .card{
      width:100%;
      max-width:850px;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.1);
      backdrop-filter:blur(20px);
      border-radius:30px;
      padding:50px;
      text-align:center;
      box-shadow:0 0 40px rgba(0,0,0,0.4);
      animation:fadeIn 1.5s ease;
    }

    .tag{
      display:inline-block;
      padding:8px 18px;
      border-radius:30px;
      background:rgba(99,102,241,0.2);
      border:1px solid rgba(99,102,241,0.4);
      color:#c7d2fe;
      font-size:0.9rem;
      margin-bottom:25px;
    }

    h1{
      font-size:4rem;
      font-weight:700;
      line-height:1.1;
      margin-bottom:15px;
      background:linear-gradient(90deg,#ffffff,#60a5fa,#a78bfa);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    h2{
      font-size:1.4rem;
      font-weight:300;
      color:#cbd5e1;
      margin-bottom:30px;
    }

    .typing{
      width:0;
      overflow:hidden;
      white-space:nowrap;
      margin:auto;
      border-right:3px solid #fff;
      font-size:1.1rem;
      color:#94a3b8;
      animation:
      typing 5s steps(45,end) forwards,
      blink .8s infinite;
    }

    @keyframes typing{
      from{
        width:0;
      }

      to{
        width:100%;
      }
    }

    @keyframes blink{
      50%{
        border-color:transparent;
      }
    }

    .buttons{
      margin-top:45px;
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:18px;
    }

    .buttons a{
      text-decoration:none;
      color:white;
      padding:14px 30px;
      border-radius:50px;
      font-weight:600;
      transition:0.3s;
      border:1px solid rgba(255,255,255,0.1);
      background:rgba(255,255,255,0.08);
    }

    .buttons a:hover{
      transform:translateY(-5px);
      background:white;
      color:#050816;
      box-shadow:0 10px 25px rgba(255,255,255,0.2);
    }

    .skills{
      margin-top:50px;
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:12px;
    }

    .skills span{
      padding:10px 18px;
      border-radius:30px;
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.08);
      color:#e2e8f0;
      font-size:0.95rem;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(40px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @media(max-width:768px){

      .card{
        padding:35px 25px;
      }

      h1{
        font-size:2.7rem;
      }

      h2{
        font-size:1rem;
      }

      .typing{
        white-space:normal;
        width:100%;
        border:none;
        animation:none;
      }
    }

  </style>
</head>

<body>

  <div class="bg">
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
  </div>

  <div class="container">

    <div class="card">

      <div class="tag">
        ✨ Welcome To My GitHub Profile
      </div>

      <h1>
        Humayra<br>Mahjabin
      </h1>

      <h2>
